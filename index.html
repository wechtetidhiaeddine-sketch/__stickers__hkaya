<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>__stickers__hkaya</title>

<style>
body{
margin:0;
font-family:Arial;
transition:.3s;
}

body.dark{
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
}

body.light{
background:#f2f2f2;
color:black;
}

header{
text-align:center;
padding:20px;
font-size:26px;
font-weight:bold;
}

.container{
max-width:950px;
margin:auto;
padding:15px;
}

.top{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

button{
border:none;
padding:10px;
border-radius:10px;
cursor:pointer;
background:#38bdf8;
font-weight:bold;
}

input{
flex:1;
padding:12px;
border-radius:10px;
border:none;
outline:none;
}

.search{
display:flex;
gap:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:15px;
margin-top:20px;
}

.card{
padding:10px;
border-radius:15px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
text-align:center;
transition:.3s;
}

.card:hover{transform:scale(1.05)}

.card img{
width:120px;
height:120px;
}

.status{
margin:10px 0;
opacity:.7;
}

.small{
font-size:12px;
padding:6px;
margin:3px;
}
</style>
</head>

<body class="dark">

<header>__stickers__hkaya</header>

<div class="container">

<div class="top">
<button onclick="toggleTheme()">🌙 Theme</button>
<button onclick="voice()">🎤 Voice</button>
<button onclick="openFav()">⭐ Favorites</button>
</div>

<div class="search">
<input id="input" placeholder="Type or speak..." oninput="autoSuggest()"/>
<button onclick="search()">Search</button>
</div>

<div id="suggest"></div>
<div id="status" class="status"></div>
<div id="grid" class="grid"></div>

</div>

<script>

const API=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;

let cache={};
let fav=JSON.parse(localStorage.getItem("fav")||"[]");

// 🌍 AI language detect + intent
function ai(text){
text=text.toLowerCase();

if(text.includes("amour")||text.includes("love")||text.includes("حب")) return "love";
if(text.includes("heureux")||text.includes("happy")||text.includes("سعيد")) return "happy";
if(text.includes("triste")||text.includes("sad")||text.includes("حزين")) return "sad";
if(text.includes("angry")||text.includes("غضب")) return "angry";
return text;
}

// ⚡ search API
async function get(query){
if(cache[query]) return cache[query];

let res=await fetch(`https://api.giphy.com/v1/stickers/search?api_key=${API}&q=${query}&limit=12`);
let data=await res.json();

let out=data.data.map(x=>({
url:x.images.fixed_height.url,
name:x.title
}));

cache[query]=out;
return out;
}

// 🔎 search
async function search(){
let input=document.getElementById("input").value;
let status=document.getElementById("status");
let grid=document.getElementById("grid");

grid.innerHTML="";

if(!input){
status.innerText="Type something...";
return;
}

let q=ai(input);

status.innerText="🧠 AI thinking...";

let data=await get(q);

status.innerText="Results:";

data.forEach(s=>{
let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<img src="${s.url}"/>
<p>${s.name}</p>
<button class="small" onclick="favAdd('${s.url}')">⭐</button>
<button class="small" onclick="share('${s.url}')">📤</button>
`;

grid.appendChild(div);
});
}

// ⭐ favorites
function favAdd(url){
if(!fav.includes(url)){
fav.push(url);
localStorage.setItem("fav",JSON.stringify(fav));
alert("Added ⭐");
}
}

// 📤 share
function share(url){
navigator.clipboard.writeText(url);
alert("Copied link 📤");
}

// 🌙 theme
function toggleTheme(){
document.body.classList.toggle("dark");
document.body.classList.toggle("light");
}

// 🎤 voice
function voice(){
let r=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
r.lang="en-US";
r.start();

r.onresult=e=>{
document.getElementById("input").value=e.results[0][0].transcript;
search();
};
}

// ⭐ favorites page
function openFav(){
let grid=document.getElementById("grid");
grid.innerHTML="";

fav.forEach(u=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=`
<img src="${u}"/>
<p>Favorite</p>
`;
grid.appendChild(div);
});
}

// ⚡ autocomplete
function autoSuggest(){
let v=document.getElementById("input").value;
let s=document.getElementById("suggest");

if(!v){s.innerHTML="";return;}

let list=["happy","sad","love","angry","cool","funny"];

let f=list.filter(x=>x.startsWith(v.toLowerCase()));

s.innerHTML=f.map(x=>`<button class="small" onclick="pick('${x}')">${x}</button>`).join(" ");
}

function pick(x){
document.getElementById("input").value=x;
search();
}

</script>

</body>
</html>
