<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Stickers Hkeya | عالم الملصقات</title>

    <style>
        :root {
            --primary: #ff7eb9;
            --secondary: #7afcff;
            --accent: #ff5e8e;
            --bg-gradient: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            background: var(--bg-gradient);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            transition: all 0.4s ease;
        }

        /* الوضع الليلي الاحترافي */
        body.dark {
            background: linear-gradient(135deg, #1e1e2f 0%, #111119 100%);
            color: #ffffff;
        }

        header {
            text-align: center;
            padding: 50px 20px;
        }

        header h1 {
            font-size: 48px;
            margin: 0;
            background: linear-gradient(45deg, #ff7eb9, #7afcff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
        }

        .container {
            max-width: 900px;
            margin: 0 auto 50px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.4);
        }

        body.dark .container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .nav-bar button {
            border: none;
            padding: 12px 24px;
            border-radius: 15px;
            cursor: pointer;
            background: white;
            color: #555;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-bar button:hover {
            transform: translateY(-3px);
            background: var(--accent);
            color: white;
            box-shadow: 0 8px 20px rgba(255, 94, 142, 0.3);
        }

        .search-area {
            position: relative;
            display: flex;
            background: white;
            padding: 8px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 2px solid transparent;
            transition: 0.3s;
        }

        .search-area:focus-within {
            border-color: var(--primary);
        }

        input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            outline: none;
            font-size: 18px;
            background: transparent;
            color: #333;
        }

        body.dark input { color: white; }

        .btn-search {
            background: linear-gradient(45deg, #ff7eb9, #ff5e8e);
            color: white;
            border: none;
            padding: 0 35px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-search:hover { opacity: 0.9; transform: scale(1.02); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .sticker-card {
            background: white;
            border-radius: 25px;
            padding: 15px;
            text-align: center;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            border: 1px solid #f0f0f0;
        }

        body.dark .sticker-card {
            background: #2a2a3d;
            border-color: #3a3a4d;
        }

        .sticker-card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .sticker-card img {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 12px;
        }

        .card-actions {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .action-btn {
            background: #f8f9fa;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
        }

        .action-btn:hover { background: var(--secondary); color: white; }

        .status-msg {
            text-align: center;
            margin-top: 20px;
            font-weight: 600;
            color: var(--accent);
        }

        #suggestions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tag {
            background: rgba(255, 126, 185, 0.1);
            color: var(--accent);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }

        .tag:hover { background: var(--accent); color: white; }

    </style>
</head>
<body>

<header>
    <h1>Stickers Hkeya</h1>
</header>

<div class="container">
    <div class="nav-bar">
        <button onclick="toggleTheme()">🌓 مظهر التطبيق</button>
        <button onclick="voiceSearch()">🎤 بحث صوتي</button>
        <button onclick="showFavorites()">⭐ المفضلة</button>
        <button onclick="loadTrending()">🔥 الأكثر رواجاً</button>
    </div>

    <div class="search-area">
        <input id="searchInput" placeholder="اكتب نوع الملصق (مثلاً: حب، مضحك...)" oninput="handleTyping()"/>
        <button class="btn-search" onclick="performSearch()">بحث</button>
    </div>

    <div id="suggestions"></div>
    <div id="status" class="status-msg"></div>
    <div id="stickerGrid" class="grid"></div>
</div>

<script>
    const GIPHY_KEY = "dc6zaTOxFJmzC";
    let favorites = JSON.parse(localStorage.getItem("stickers_fav") || "[]");

    // محرك ذكاء اصطناعي بسيط للترجمة والكلمات المفتاحية
    function aiTranslate(term) {
        const map = {
            "حب": "love", "قلب": "heart", "ضحك": "lol", "بكا": "sad",
            "مضحك": "funny", "قطط": "cats", "ورد": "flowers", "قهوة": "coffee"
        };
        return map[term.trim()] || term;
    }

    async function performSearch() {
        const query = document.getElementById("searchInput").value;
        const grid = document.getElementById("stickerGrid");
        const status = document.getElementById("status");

        if (!query) return;

        grid.innerHTML = "";
        status.innerText = "✨ جاري البحث عن أجمل الملصقات...";

        try {
            const translated = aiTranslate(query);
            const response = await fetch(`https://api.giphy.com/v1/stickers/search?api_key=${GIPHY_KEY}&q=${encodeURIComponent(translated)}&limit=20`);
            const json = await response.json();
            
            if (json.data.length === 0) {
                status.innerText = "😢 لم نجد ملصقات بهذا الاسم، جرب كلمة أخرى!";
                return;
            }

            status.innerText = `نتائج البحث عن: ${query}`;
            displayStickers(json.data);
        } catch (e) {
            status.innerText = "❌ عذراً، حدث خطأ في الاتصال";
        }
    }

    function displayStickers(data) {
        const grid = document.getElementById("stickerGrid");
        data.forEach(item => {
            const url = item.images.fixed_height.url;
            const card = document.createElement("div");
            card.className = "sticker-card";
            card.innerHTML = `
                <img src="${url}" alt="sticker" loading="lazy">
                <div class="card-actions">
                    <button class="action-btn" onclick="addToFav('${url}')">⭐</button>
                    <button class="action-btn" onclick="copyLink('${url}')">🔗</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function addToFav(url) {
        if (!favorites.includes(url)) {
            favorites.push(url);
            localStorage.setItem("stickers_fav", JSON.stringify(favorites));
            alert("تمت الإضافة للمفضلة بنجاح! ❤️");
        }
    }

    function copyLink(url) {
        navigator.clipboard.writeText(url);
        alert("تم نسخ رابط الملصق، يمكنك لصقه في الواتساب أو ماسنجر! ✅");
    }

    function toggleTheme() {
        document.body.classList.toggle("dark");
    }

    function voiceSearch() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'ar-SA';
        recognition.start();
        recognition.onresult = (event) => {
            document.getElementById("searchInput").value = event.results[0][0].transcript;
            performSearch();
        };
    }

    async function loadTrending() {
        const status = document.getElementById("status");
        status.innerText = "🔥 اكتشف الملصقات الرائجة الآن...";
        const response = await fetch(`https://api.giphy.com/v1/stickers/trending?api_key=${GIPHY_KEY}&limit=20`);
        const json = await response.json();
        document.getElementById("stickerGrid").innerHTML = "";
        displayStickers(json.data);
    }

    function showFavorites() {
        const grid = document.getElementById("stickerGrid");
        grid.innerHTML = "";
        document.getElementById("status").innerText = "⭐ ملصقاتك المفضلة";
        
        if (favorites.length === 0) {
            grid.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>لا توجد ملصقات في المفضلة بعد.</p>";
            return;
        }

        favorites.forEach(url => {
            const card = document.createElement("div");
            card.className = "sticker-card";
            card.innerHTML = `
                <img src="${url}">
                <button class="btn-search" style="padding: 5px 10px; font-size: 12px;" onclick="removeFav('${url}')">إزالة</button>
            `;
            grid.appendChild(card);
        });
    }

    function removeFav(url) {
        favorites = favorites.filter(f => f !== url);
        localStorage.setItem("stickers_fav", JSON.stringify(favorites));
        showFavorites();
    }

    function handleTyping() {
        const val = document.getElementById("searchInput").value;
        const suggBox = document.getElementById("suggestions");
        if(val.length < 1) { suggBox.innerHTML = ""; return; }
        
        const tags = ["حب", "مضحك", "صباح الخير", "قطط", "بكا", "قلوب"];
        const filtered = tags.filter(t => t.includes(val));
        suggBox.innerHTML = filtered.map(t => `<span class="tag" onclick="quickPick('${t}')">${t}</span>`).join("");
    }

    function quickPick(t) {
        document.getElementById("searchInput").value = t;
        performSearch();
    }

    // تحميل التريند تلقائياً عند فتح الموقع
    window.onload = loadTrending;

</script>

</body>
</html>
