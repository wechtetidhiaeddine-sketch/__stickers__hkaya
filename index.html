<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🚀 AI coding </title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial;
background:url("YOUR_IMAGE_HERE.jpg") no-repeat center center/cover;
color:white;
}

/* Overlay */
body::before{
content:"";
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(6px);
z-index:-1;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

/* Cards */
.card{
background:rgba(255,255,255,0.08);
padding:20px;
margin-top:15px;
border-radius:15px;
backdrop-filter:blur(10px);
transition:.3s;
}

.card:hover{
transform:scale(1.02);
}

/* Inputs */
input{
width:100%;
padding:12px;
border-radius:20px;
border:none;
margin:5px 0;
outline:none;
}

/* Buttons */
button{
padding:10px 15px;
border-radius:20px;
border:none;
background:linear-gradient(45deg,#4facfe,#00f2fe);
color:white;
cursor:pointer;
transition:.3s;
}

button:hover{
opacity:.8;
transform:scale(1.05);
}

/* Result Cards */
.result-card{
background:rgba(255,255,255,0.1);
padding:15px;
margin-top:10px;
border-radius:10px;
animation:fade .5s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(10px)}
to{opacity:1;transform:translateY(0)}
}

/* Progress */
.progress{
height:8px;
background:#ffffff33;
border-radius:10px;
margin:10px 0;
}

.bar{
height:100%;
background:#00ffcc;
width:0%;
}

/* Stickers */
.sticker{
font-size:40px;
margin:5px;
display:inline-block;
transition:.3s;
cursor:pointer;
}

.sticker:hover{
transform:scale(1.3) rotate(10deg);
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 AI coding d&t PRO</h1>

<!-- LOGIN -->
<div class="card">
<input id="user" placeholder="Username">
<button onclick="login()">Login</button>
<p id="welcome"></p>
</div>

<!-- SEARCH -->
<div class="card">
<input id="q" placeholder="Recherche ou sticker...">
<button onclick="search()">Search</button>
<button onclick="voice()">🎤</button>
<div id="result"></div>
</div>

<!-- AI -->
<div class="card">
<input id="msg" placeholder="Ask AI...">
<button onclick="chat()">Send</button>
<div id="chatBox"></div>
</div>

<!-- COMPARE -->
<div class="card">
<input id="a" placeholder="Langage 1">
<input id="b" placeholder="Langage 2">
<button onclick="compare()">Compare</button>
<div id="cmp"></div>
</div>

<!-- FAVORITES -->
<div class="card">
<h3>⭐ Favoris</h3>
<div id="fav"></div>
</div>

<!-- QUIZ -->
<div class="card">
<h3>🧠 Quiz</h3>
<button onclick="startQuiz()">Start</button>
<button onclick="aiQuiz()">AI Quiz</button>
<div id="quiz"></div>
</div>

</div>

<script>

/* LOGIN */
function login(){
let u=user.value;
localStorage.setItem("user",u);
welcome.innerText="Bienvenue "+u;
}

/* SEARCH + STICKERS */
const stickers={
"love":["❤️","😍","😘"],
"sad":["😢","😭","💔"],
"happy":["😄","😁","🥳"],
"fire":["🔥","💥","⚡"],
"cool":["😎","🧊","🚀"]
};

async function search(){
let q=document.getElementById("q").value.toLowerCase();

result.innerHTML="";

/* Sticker detection */
if(stickers[q]){
result.innerHTML=stickers[q].map(s=>`<span class="sticker">${s}</span>`).join("");
return;
}

/* Wikipedia */
try{
let r=await fetch("https://fr.wikipedia.org/api/rest_v1/page/summary/"+q);
let d=await r.json();

result.innerHTML=`
<div class="result-card">
<h2>${d.title}</h2>
<p>${d.extract}</p>
<button onclick="save('${d.title}')">⭐</button>
</div>`;
}catch{
result.innerHTML="❌ Aucun résultat";
}
}

/* AI CHAT */
async function chat(){
let msg=document.getElementById("msg").value;

chatBox.innerHTML+=`<p>🧑 ${msg}</p>`;

try{
let r=await fetch("http://localhost:3000/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({msg})
});

let d=await r.json();
chatBox.innerHTML+=`<p>🤖 ${d.reply}</p>`;
}catch{
chatBox.innerHTML+=`<p>🤖 (offline mode)</p>`;
}
}

/* COMPARE */
function compare(){
cmp.innerHTML=`👉 ${a.value} ≠ ${b.value}`;
}

/* FAVORITES */
function loadFav(){
let f=JSON.parse(localStorage.getItem("fav")||"[]");
fav.innerHTML=f.map(x=>`⭐ ${x}`).join("<br>");
}
loadFav();

function save(x){
let f=JSON.parse(localStorage.getItem("fav")||"[]");
f.push(x);
localStorage.setItem("fav",JSON.stringify(f));
loadFav();
}

/* QUIZ */
let quizData=[
{q:"JS sert à ?",o:["Design","Interaction web","DB"],a:1},
{q:"HTML ?",o:["Langage","Email","OS"],a:0}
];

let i=0,score=0,time=10,t;

function startQuiz(){
i=0;score=0;
next();
}

function next(){
clearInterval(t);

if(i>=quizData.length){
quiz.innerHTML=`Score: ${score}`;
return;
}

let q=quizData[i];

quiz.innerHTML=`
<p>${q.q}</p>
<div class="progress"><div class="bar" id="bar"></div></div>
${q.o.map((x,idx)=>`<button onclick="ans(${idx})">${x}</button>`).join("<br>")}
`;

time=10;

t=setInterval(()=>{
time--;
bar.style.width=(time*10)+"%";

if(time<=0){
i++;next();
}
},1000);
}

function ans(x){
if(x===quizData[i].a) score++;
i++;
next();
}

/* AI QUIZ */
async function aiQuiz(){
quiz.innerHTML="⏳ loading...";
}

/* VOICE */
function voice(){
let r=new webkitSpeechRecognition();
r.lang="fr-FR";
r.onresult=e=>{
q.value=e.results[0][0].transcript;
search();
};
r.start();
}

</script>

</body>
</html>
