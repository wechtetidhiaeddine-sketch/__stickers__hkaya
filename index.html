<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Stickers Hkeya - عالم الملصقات</title>

    <style>
        :root {
            --primary: #ff7eb9;
            --secondary: #7afcff;
            --glass: rgba(255, 255, 255, 0.2);
            --dark-glass: rgba(0, 0, 0, 0.4);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* وضع الصورة كخلفية ثابتة */
            background: url('https://i.postimg.cc/mD8zM6L6/image-c6d5f8.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #333;
            transition: 0.3s;
        }

        /* طبقة حماية لضمان قراءة النصوص فوق الصورة */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.3); /* تفتيح الصورة قليلاً */
            z-index: -1;
        }

        body.dark::before {
            background: rgba(0, 0, 0, 0.7); /* تغميق الصورة في الوضع الليلي */
        }

        body.dark { color: white; }

        header {
            text-align: center;
            padding: 40px 20px;
            font-size: 42px;
            font-weight: 900;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            color: #ff5e8e;
            letter-spacing: -1px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
            backdrop-filter: blur(5px);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            margin-bottom: 50px;
        }

        .top-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            cursor: pointer;
            background: white;
            color: #ff5e8e;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-3px);
            background: #ff5e8e;
            color: white;
        }

        .search-box {
            display: flex;
            gap: 10px;
            background: white;
            padding: 8px;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        input {
            flex: 1;
            padding: 15px 25px;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
        }

        .search-btn {
            background: linear-gradient(45deg, #ff7eb9, #ff5e8e);
            color: white;
            padding: 0 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card:hover {
            transform: scale(1.05) rotate(2deg);
            background: white;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 14px;
            font-weight: bold;
            margin: 10px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status {
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
            color: #ff5e8e;
        }

        #suggest {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .suggest-tag {
            background: rgba(255,255,255,0.5);
            font-size: 12px;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
        }

        .action-btns {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .small-btn {
            padding: 8px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>Stickers Hkeya</header>

<div class="container">
    <div class="top-nav">
        <button onclick="toggleTheme()">🌓 تغيير الوضع</button>
        <button onclick="voice()">🎤 بحث صوتي</button>
        <button onclick="openFav()">⭐ المفضلة</button>
        <button onclick="loadTrending()">🔥 الرائج الآن</button>
    </div>

    <div class="search-box">
        <input id="input" placeholder="عن ماذا تبحث؟ (حب، مضحك، قطط...)" oninput="autoSuggest()"/>
        <button class="search-btn" onclick="search()">ابحث</button>
    </div>

    <div id="suggest"></div>
    <div id="status" class="status"></div>
    <div id="grid" class="grid"></div>
</div>

<script>
    const API = "dc6zaTOxFJmzC"; // ملاحظة: يفضل استخدام Key خاص بك من Giphy للحصول على نتائج أفضل
    let cache = {};
    let fav = JSON.parse(localStorage.getItem("fav") || "[]");

    // تحويل الكلمات العربية إلى إنجليزية للبحث في Giphy
    function ai(text) {
        text = text.toLowerCase();
        const dictionary = {
            "حب": "love", "سعيد": "happy", "حزين": "sad", "غاضب": "angry",
            "مضحك": "funny", "قطط": "cats", "صباح": "morning", "ورد": "flowers"
        };
        return dictionary[text] || text;
    }

    async function get(query) {
        if (cache[query]) return cache[query];
        try {
            let res = await fetch(`https://api.giphy.com/v1/stickers/search?api_key=${API}&q=${encodeURIComponent(query)}&limit=16`);
            let data = await res.json();
            let out = data.data.map(x => ({
                url: x.images.fixed_height.url,
                name: x.title || "ملصق رائع"
            }));
            cache[query] = out;
            return out;
        } catch (e) { return []; }
    }

    async function search() {
        let input = document.getElementById("input").value.trim();
        let grid = document.getElementById("grid");
        let status = document.getElementById("status");

        if (!input) { status.innerText = "اكتب شيئاً للبحث..."; return; }

        grid.innerHTML = "";
        status.innerText = "🚀 جاري استخراج الملصقات...";
        
        let q = ai(input);
        let data = await get(q);

        if (data.length === 0) {
            status.innerText = "لم نجد نتائج 😢";
            return;
        }

        status.innerText = `نتائج البحث عن: ${input}`;
        render(data);
    }

    function render(data) {
        let grid = document.getElementById("grid");
        data.forEach(s => {
            let div = document.createElement("div");
            div.className = "card";
            div.innerHTML = `
                <img src="${s.url}" loading="lazy"/>
                <p>${s.name}</p>
                <div class="action-btns">
                    <button class="small-btn" onclick="favAdd('${s.url}')">⭐</button>
                    <button class="small-btn" onclick="share('${s.url}')">🔗</button>
                </div>
            `;
            grid.appendChild(div);
        });
    }

    function favAdd(url) {
        if (!fav.includes(url)) {
            fav.push(url);
            localStorage.setItem("fav", JSON.stringify(fav));
            alert("تمت الإضافة للمفضلة! ⭐");
        }
    }

    function share(url) {
        navigator.clipboard.writeText(url);
        alert("تم نسخ رابط الملصق! 📤");
    }

    function toggleTheme() {
        document.body.classList.toggle("dark");
    }

    function voice() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) { alert("متصفحك لا يدعم البحث الصوتي"); return; }
        let r = new SpeechRecognition();
        r.lang = "ar-SA";
        r.start();
        r.onresult = e => {
            document.getElementById("input").value = e.results[0][0].transcript;
            search();
        };
    }

    function openFav() {
        let grid = document.getElementById("grid");
        grid.innerHTML = "";
        if (fav.length === 0) { grid.innerHTML = "<p>المفضلة فارغة حالياً ⭐</p>"; return; }
        
        document.getElementById("status").innerText = "ملصقاتك المفضلة";
        fav.forEach((u, i) => {
            let div = document.createElement("div");
            div.className = "card";
            div.innerHTML = `
                <img src="${u}"/>
                <p>ملصق محفوظ</p>
                <button class="small-btn" onclick="removeFav(${i})">🗑️ حذف</button>
            `;
            grid.appendChild(div);
        });
    }

    function removeFav(i) {
        fav.splice(i, 1);
        localStorage.setItem("fav", JSON.stringify(fav));
        openFav();
    }

    async function loadTrending() {
        document.getElementById("status").innerText = "🔥 ملصقات رائجة الآن...";
        let res = await fetch(`https://api.giphy.com/v1/stickers/trending?api_key=${API}&limit=16`);
        let data = await res.json();
        let grid = document.getElementById("grid");
        grid.innerHTML = "";
        let cleanData = data.data.map(x => ({ url: x.images.fixed_height.url, name: "تريند" }));
        render(cleanData);
    }

    function autoSuggest() {
        let v = document.getElementById("input").value;
        let s = document.getElementById("suggest");
        if (!v) { s.innerHTML = ""; return; }
        let list = ["حب", "مضحك", "قطط", "سعيد", "صباح الخير", "ورد"];
        let f = list.filter(x => x.includes(v));
        s.innerHTML = f.map(x => `<div class="suggest-tag" onclick="pick('${x}')">${x}</div>`).join("");
    }

    function pick(x) {
        document.getElementById("input").value = x;
        search();
    }

    // التحميل التلقائي للرائج عند الفتح
    window.onload = loadTrending;

</script>

</body>
</html><!DOCTYPE html>
<html lang="en">

<body>

<header>__stickers__hkaya</header>

<div class="container">

<div class="top">
<button onclick="toggleTheme()">🌙 Theme</button>
<button onclick="voice()">🎤 Voice</button>
<button onclick="openFav()">⭐ Favorites</button>
<button onclick="loadTrending()">🔥 Trending</button>
</div>

<div class="search">
<input id="input" placeholder="Type or speak..." oninput="autoSuggest()"/>
<button onclick="search()">Search</button>
</div>

<div id="suggest"></div>
<div id="status" class="status"></div>
<div id="grid" class="grid"></div>

</div>

<script>

const API="dc6zaTOxFJmzC";

let cache={};
let fav=JSON.parse(localStorage.getItem("fav")||"[]");

// 🧠 Smart AI detection
function ai(text){
text=text.toLowerCase();

if(text.match(/love|amour|حب|❤️/)) return "love";
if(text.match(/happy|heureux|سعيد|😊/)) return "happy";
if(text.match(/sad|triste|حزين|😢/)) return "sad";
if(text.match(/angry|mad|غضب|😡/)) return "angry";

return text;
}

// ⚡ API fetch
async function get(query){
if(cache[query]) return cache[query];

let res=await fetch(`https://api.giphy.com/v1/stickers/search?api_key=${API}&q=${query}&limit=12`);
let data=await res.json();

if(!data.data) return [];

let out=data.data.map(x=>({
url:x.images.fixed_height.url,
name:x.title || "Sticker"
}));

cache[query]=out;
return out;
}

// 🔎 search
async function search(){
let input=document.getElementById("input").value.trim();
let status=document.getElementById("status");
let grid=document.getElementById("grid");

grid.innerHTML="";

if(!input){
status.innerText="Type something...";
return;
}

let q=ai(input);

status.innerText="🧠 Searching AI...";

let data=await get(q);

if(data.length===0){
status.innerText="No results 😢";
return;
}

status.innerText="Results:";

data.forEach(s=>{
let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<img src="${s.url}"/>
<p>${s.name}</p>
<button class="small" onclick="favAdd('${s.url}')">⭐</button>
<button class="small" onclick="share('${s.url}')">📤</button>
`;

grid.appendChild(div);
});
}

// ⭐ add fav
function favAdd(url){
if(!fav.includes(url)){
fav.push(url);
localStorage.setItem("fav",JSON.stringify(fav));
alert("Added ⭐");
}
}

// 📤 share
function share(url){
navigator.clipboard.writeText(url);
alert("Copied 📤");
}

// 🌙 theme
function toggleTheme(){
document.body.classList.toggle("dark");
document.body.classList.toggle("light");
}

// 🎤 voice (fixed)
function voice(){
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(!SpeechRecognition){
alert("Voice not supported in this browser");
return;
}

let r=new SpeechRecognition();
r.lang="en-US";
r.start();

r.onresult=e=>{
document.getElementById("input").value=e.results[0][0].transcript;
search();
};
}

// ⭐ favorites view (with delete)
function openFav(){
let grid=document.getElementById("grid");
grid.innerHTML="";

if(fav.length===0){
grid.innerHTML="<p>No favorites yet ⭐</p>";
return;
}

fav.forEach((u,i)=>{
let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<img src="${u}"/>
<p>Favorite</p>
<button class="small" onclick="removeFav(${i})">🗑️</button>
`;

grid.appendChild(div);
});
}

function removeFav(i){
fav.splice(i,1);
localStorage.setItem("fav",JSON.stringify(fav));
openFav();
}

// ⚡ trending
async function loadTrending(){
let status=document.getElementById("status");
status.innerText="🔥 Loading trending...";

let res=await fetch(`https://api.giphy.com/v1/stickers/trending?api_key=${API}&limit=12`);
let data=await res.json();

let grid=document.getElementById("grid");
grid.innerHTML="";

data.data.forEach(s=>{
let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<img src="${s.images.fixed_height.url}"/>
<p>Trending</p>
<button class="small" onclick="favAdd('${s.images.fixed_height.url}')">⭐</button>
`;

grid.appendChild(div);
});

status.innerText="Trending 🔥";
}

// ⚡ autocomplete
function autoSuggest(){
let v=document.getElementById("input").value;
let s=document.getElementById("suggest");

if(!v){s.innerHTML="";return;}

let list=["happy","sad","love","angry","funny","cool"];

let f=list.filter(x=>x.startsWith(v.toLowerCase()));

s.innerHTML=f.map(x=>`<button class="small" onclick="pick('${x}')">${x}</button>`).join(" ");
}

function pick(x){
document.getElementById("input").value=x;
search();
}

// 🌙 auto theme
if(window.matchMedia('(prefers-color-scheme: dark)').matches){
document.body.classList.add("dark");
}

</script>

</body>
