<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>__stickers__hkaya</title>

<style>
body{
margin:0;
font-family:Arial;
transition:.3s;
}

body.dark{
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
}

body.light{
background:#f2f2f2;
color:black;
}

header{
text-align:center;
padding:20px;
font-size:26px;
font-weight:bold;
}

.container{
max-width:950px;
margin:auto;
padding:15px;
}

.top{
display:flex;
justify-content:space-between;
margin-bottom:10px;
gap:10px;
flex-wrap:wrap;
}

button{
border:none;
padding:10px;
border-radius:10px;
cursor:pointer;
background:#38bdf8;
font-weight:bold;
}

input{
flex:1;
padding:12px;
border-radius:10px;
border:none;
outline:none;
}

.search{
display:flex;
gap:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:15px;
margin-top:20px;
}

.card{
padding:10px;
border-radius:15px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
text-align:center;
transition:.3s;
}

.card:hover{transform:scale(1.05)}

.card img{
width:120px;
height:120px;
object-fit:cover;
}

.status{
margin:10px 0;
opacity:.7;
}

.small{
font-size:12px;
padding:6px;
margin:3px;
}
</style>
</head>

<body>

<header>__stickers__hkaya</header>

<div class="container">

<div class="top">
<button onclick="toggleTheme()">🌙 Theme</button>
<button onclick="voice()">🎤 Voice</button>
<button onclick="openFav()">⭐ Favorites</button>
<button onclick="loadTrending()">🔥 Trending</button>
</div>

<div class="search">
<input id="input" placeholder="Type or speak..." oninput="autoSuggest()"/>
<button onclick="search()">Search</button>
</div>

<div id="suggest"></div>
<div id="status" class="status"></div>
<div id="grid" class="grid"></div>

</div>

<script>

const API="dc6zaTOxFJmzC";

let cache={};
let fav=JSON.parse(localStorage.getItem("fav")||"[]");

// 🧠 Smart AI detection
function ai(text){
text=text.toLowerCase();

if(text.match(/love|amour|حب|❤️/)) return "love";
if(text.match(/happy|heureux|سعيد|😊/)) return "happy";
if(text.match(/sad|triste|حزين|😢/)) return "sad";
if(text.match(/angry|mad|غضب|😡/)) return "angry";

return text;
}

// ⚡ API fetch
async function get(query){
if(cache[query]) return cache[query];

let res=await fetch(`https://api.giphy.com/v1/stickers/search?api_key=${API}&q=${query}&limit=12`);
let data=await res.json();

if(!data.data) return [];

let out=data.data.map(x=>({
url:x.images.fixed_height.url,
name:x.title || "Sticker"
}));

cache[query]=out;
return out;
}

// 🔎 search
async function search(){
let input=document.getElementById("input").value.trim();
let status=document.getElementById("status");
let grid=document.getElementById("grid");

grid.innerHTML="";

if(!input){
status.innerText="Type something...";
return;
}

let q=ai(input);

status.innerText="🧠 Searching AI...";

let data=await get(q);

if(data.length===0){
status.innerText="No results 😢";
return;
}

status.innerText="Results:";

data.forEach(s=>{
let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<img src="${s.url}"/>
<p>${s.name}</p>
<button class="small" onclick="favAdd('${s.url}')">⭐</button>
<button class="small" onclick="share('${s.url}')">📤</button>
`;

grid.appendChild(div);
});
}

// ⭐ add fav
function favAdd(url){
if(!fav.includes(url)){
fav.push(url);
localStorage.setItem("fav",JSON.stringify(fav));
alert("Added ⭐");
}
}

// 📤 share
function share(url){
navigator.clipboard.writeText(url);
alert("Copied 📤");
}

// 🌙 theme
function toggleTheme(){
document.body.classList.toggle("dark");
document.body.classList.toggle("light");
}

// 🎤 voice (fixed)
function voice(){
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(!SpeechRecognition){
alert("Voice not supported in this browser");
return;
}

let r=new SpeechRecognition();
r.lang="en-US";
r.start();

r.onresult=e=>{
document.getElementById("input").value=e.results[0][0].transcript;
search();
};
}

// ⭐ favorites view (with delete)
function openFav(){
let grid=document.getElementById("grid");
grid.innerHTML="";

if(fav.length===0){
grid.innerHTML="<p>No favorites yet ⭐</p>";
return;
}

fav.forEach((u,i)=>{
let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<img src="${u}"/>
<p>Favorite</p>
<button class="small" onclick="removeFav(${i})">🗑️</button>
`;

grid.appendChild(div);
});
}

function removeFav(i){
fav.splice(i,1);
localStorage.setItem("fav",JSON.stringify(fav));
openFav();
}

// ⚡ trending
async function loadTrending(){
let status=document.getElementById("status");
status.innerText="🔥 Loading trending...";

let res=await fetch(`https://api.giphy.com/v1/stickers/trending?api_key=${API}&limit=12`);
let data=await res.json();

let grid=document.getElementById("grid");
grid.innerHTML="";

data.data.forEach(s=>{
let div=document.createElement("div");
div.className="card";

div.innerHTML=`
<img src="${s.images.fixed_height.url}"/>
<p>Trending</p>
<button class="small" onclick="favAdd('${s.images.fixed_height.url}')">⭐</button>
`;

grid.appendChild(div);
});

status.innerText="Trending 🔥";
}

// ⚡ autocomplete
function autoSuggest(){
let v=document.getElementById("input").value;
let s=document.getElementById("suggest");

if(!v){s.innerHTML="";return;}

let list=["happy","sad","love","angry","funny","cool"];

let f=list.filter(x=>x.startsWith(v.toLowerCase()));

s.innerHTML=f.map(x=>`<button class="small" onclick="pick('${x}')">${x}</button>`).join(" ");
}

function pick(x){
document.getElementById("input").value=x;
search();
}

// 🌙 auto theme
if(window.matchMedia('(prefers-color-scheme: dark)').matches){
document.body.classList.add("dark");
}

</script>

</body>
</html>
